version: 1
project: VisualContract demo

viewports:
  - name: mobile
    width: 390
    height: 844
  - name: desktop
    width: 1280
    height: 800

navigation:
  waitUntil: load
  timeoutMs: 10000
  stabilizeMs: 50

rules:
  overflow:
    enabled: true
    tolerance: 1
    ignore: []
  contrast:
    enabled: true
    minimumRatio: 4.5
    largeTextRatio: 3
    ignore: []
  touchTargets:
    enabled: true
    minimumSize: 24
    ignore: []
  alignment:
    - name: card headings
      selectors: [".card:nth-of-type(1) h2", ".card:nth-of-type(2) h2", ".card:nth-of-type(3) h2"]
      edge: top
      tolerance: 2
      severity: error
  spacing:
    - name: navigation spacing
      selectors: ["nav a:nth-of-type(1)", "nav a:nth-of-type(2)", "nav a:nth-of-type(3)"]
      axis: horizontal
      tolerance: 2
      severity: warning
  protectedRegions: []

output:
  directory: visual-contract-results
  baselineDirectory: .visual-contract/baselines
  failOn: error
  maxFindingsPerRule: 50

browser: {}

ai:
  enabled: false
  model: gpt-5.6-terra
  detail: high
  maxViewports: 2
