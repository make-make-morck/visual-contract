name: Feature request
description: Propose a focused new rule, integration, or workflow improvement.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Design-review problem
      description: What repeated problem cannot be expressed today?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed visual contract
      description: Show the desired configuration and pass/fail behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
